<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Prueba WebAR - MindAR</title>

    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

    <!-- MindAR para seguimiento de imágenes -->
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

</head>

<body>

   <a-scene
        mindar-image="imageTargetSrc: assets/targets/marcador.mind;"
        vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: false">

        <!-- Cámara -->
        <a-camera
            position="0 0 0"
            look-controls="enabled: false">
        </a-camera>


        <!-- OBJETO SOBRE LA IMAGEN -->
        <a-entity
            mindar-image-target="targetIndex: 0">

            <!-- Grupo del círculo -->
            <a-entity
                position="0 0 0"
                scale="0.3 0.3 0.3">


                <!-- SECTOR 1 -->
                <a-entity
                    id="sector1"
                    class="sector"
                    geometry="primitive: circle;radius: 1; thetaStart: 0;thetaLength: 90"
                    material="color: red; side: double"
                    rotation="0 0 0">
                </a-entity>


                <!-- SECTOR 2 -->
                <a-entity
                    id="sector2"
                    class="sector"
                    geometry="primitive: circle; radius: 1;thetaStart: 90; thetaLength: 90"
                    material="color: blue; side: double"
                    rotation="0 0 0">
                </a-entity>


                <!-- SECTOR 3 -->
                <a-entity
                    id="sector3"
                    class="sector"
                    geometry="primitive: circle;
                              radius: 1;
                              thetaStart: 180;
                              thetaLength: 90"
                    material="color: green; side: double"
                    rotation="0 0 0">
                </a-entity>


                <!-- SECTOR 4 -->
                <a-entity
                    id="sector4"
                    class="sector"
                    geometry="primitive: circle;
                              radius: 1;
                              thetaStart: 270;
                              thetaLength: 90"
                    material="color: yellow; side: double"
                    rotation="0 0 0">
                </a-entity>

            </a-entity>

        </a-entity>

    </a-scene>


    <!-- INTERACCIÓN -->
<script>

document.addEventListener("DOMContentLoaded", function () {

    const escena = document.querySelector("a-scene");

    const circulo = document.querySelector(
        '[mindar-image-target="targetIndex: 0"]'
    );

    const sectores = [
        document.querySelector("#sector1"),
        document.querySelector("#sector2"),
        document.querySelector("#sector3"),
        document.querySelector("#sector4")
    ];

    const coloresOriginales = [
        "red",
        "blue",
        "green",
        "yellow"
    ];


    document.addEventListener("touchstart", function (evento) {

        const dedo = evento.touches[0];

        const x = dedo.clientX;
        const y = dedo.clientY;


        /*
        Convertimos la posición 3D del círculo
        a posición real en la pantalla.
        */

        const posicion3D =
            new THREE.Vector3();

        circulo.object3D.getWorldPosition(
            posicion3D
        );


        const camara =
            escena.camera;

        const posicionPantalla =
            posicion3D.clone();

        posicionPantalla.project(camara);


        const centroX =
            (posicionPantalla.x + 1) *
            window.innerWidth / 2;

        const centroY =
            (-posicionPantalla.y + 1) *
            window.innerHeight / 2;


        /*
        Calculamos la distancia
        entre el dedo y el centro real.
        */

        const diferenciaX =
            x - centroX;

        const diferenciaY =
            centroY - y;


        const distancia =
            Math.sqrt(
                diferenciaX * diferenciaX +
                diferenciaY * diferenciaY
            );


        /*
        Calculamos aproximadamente
        el tamaño real del círculo.
        */

        const radio =
            window.innerHeight * 0.15;


        // Si tocamos fuera del círculo,
        // no hacemos nada.

        if (distancia > radio) {
            return;
        }


        /*
        Calculamos el ángulo.
        */

        let angulo =
            Math.atan2(
                diferenciaY,
                diferenciaX
            ) * 180 / Math.PI;


        if (angulo < 0) {
            angulo += 360;
        }


        /*
        Identificamos el sector.
        */

        const indice =
            Math.floor(angulo / 90);


        const sector =
            sectores[indice];


        if (!sector) {
            return;
        }


        /*
        Cambiar color.
        */

        const seleccionado =
            sector.getAttribute(
                "data-seleccionado"
            );


        if (seleccionado === "true") {

            sector.setAttribute(
                "data-seleccionado",
                "false"
            );

            sector.setAttribute(
                "material",
                "color: " +
                coloresOriginales[indice] +
                "; side: double"
            );

        } else {

            sector.setAttribute(
                "data-seleccionado",
                "true"
            );

            sector.setAttribute(
                "material",
                "color: white; side: double"
            );

        }

    });

});

</script>
    
</body>
</html>
