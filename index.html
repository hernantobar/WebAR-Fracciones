<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Prueba WebAR - MindAR</title>

    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

    <!-- MindAR para seguimiento de imágenes -->
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

</head>

<body>

   <a-scene
        mindar-image="imageTargetSrc: assets/targets/marcador.mind;"
        vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: false">

        <!-- Cámara -->
        <a-camera
            position="0 0 0"
            look-controls="enabled: false">
        </a-camera>


        <!-- OBJETO SOBRE LA IMAGEN -->
        <a-entity
            mindar-image-target="targetIndex: 0">

            <!-- Grupo del círculo -->
            <a-entity
                position="0 0 0"
                scale="0.3 0.3 0.3">


                <!-- SECTOR 1 -->
                <a-entity
                    id="sector1"
                    class="sector"
                    geometry="primitive: circle;radius: 1; thetaStart: 0;thetaLength: 90"
                    material="color: red; side: double"
                    rotation="0 0 0">
                </a-entity>


                <!-- SECTOR 2 -->
                <a-entity
                    id="sector2"
                    class="sector"
                    geometry="primitive: circle; radius: 1;thetaStart: 90; thetaLength: 90"
                    material="color: blue; side: double"
                    rotation="0 0 0">
                </a-entity>


                <!-- SECTOR 3 -->
                <a-entity
                    id="sector3"
                    class="sector"
                    geometry="primitive: circle;
                              radius: 1;
                              thetaStart: 180;
                              thetaLength: 90"
                    material="color: green; side: double"
                    rotation="0 0 0">
                </a-entity>


                <!-- SECTOR 4 -->
                <a-entity
                    id="sector4"
                    class="sector"
                    geometry="primitive: circle;
                              radius: 1;
                              thetaStart: 270;
                              thetaLength: 90"
                    material="color: yellow; side: double"
                    rotation="0 0 0">
                </a-entity>

            </a-entity>

        </a-entity>

    </a-scene>


    <!-- INTERACCIÓN -->
    <script>

        document.addEventListener("DOMContentLoaded", function () {

            const sectores=document.querySelectorAll(".sector");

            sectores.forEach(function (sector) {

                sector.addEventListener("click", function () {

                    const seleccionado =
                        sector.getAttribute("data-seleccionado");


                    if (seleccionado === "true") {

                        sector.setAttribute(
                            "data-seleccionado",
                            "false"
                        );

                        // Volver al color original
                        const id =
                            sector.getAttribute("id");

                        if (id === "sector1") {
                            sector.setAttribute(
                                "material",
                                "color: red; side: double"
                            );
                        }

                        if (id === "sector2") {
                            sector.setAttribute(
                                "material",
                                "color: blue; side: double"
                            );
                        }

                        if (id === "sector3") {
                            sector.setAttribute(
                                "material",
                                "color: green; side: double"
                            );
                        }

                        if (id === "sector4") {
                            sector.setAttribute(
                                "material",
                                "color: yellow; side: double"
                            );
                        }


                    } else {

                        sector.setAttribute(
                            "data-seleccionado",
                            "true"
                        );

                        // Color de selección
                        sector.setAttribute(
                            "material",
                            "color: white; side: double"
                        );

                    }

                });

            });

        });

    </script>

</body>
</html>
