<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Prueba WebAR - MindAR</title>

    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

    <!-- MindAR para seguimiento de imágenes -->
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<style>
    #controles {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        width: 80%;
        max-width: 400px;
        background: rgba(0, 0, 0, 0.75);
        padding: 12px;
        border-radius: 15px;
        z-index: 9999;
        text-align: center;
        color: white;
        font-family: Arial, sans-serif;
    }

    #partes {
        width: 100%;
    }

    #numeroPartes {
        font-weight: bold;
    }
</style>
    
</head>

<body>

   <a-scene
        mindar-image="imageTargetSrc: assets/targets/marcador.mind;"
        vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: false">

        <!-- Cámara -->
        <a-camera
            position="0 0 0"
            look-controls="enabled: false">
        </a-camera>


        <!-- OBJETO SOBRE LA IMAGEN -->
        <a-entity
            mindar-image-target="targetIndex: 0">

            <!-- Grupo del círculo -->

            <a-entity
                id="circulo"
                position="0 0 0"
                scale= "0.3 0.3 0.3">
            </a-entity>
            
        </a-entity>

    </a-scene>

   <!-- DESLIZADOR --> 
<div id="controles">
    <label for="partes">
        Partes: <span id="numeroPartes">4</span>
    </label>

    <input
        type="range"
        id="partes"
        min="2"
        max="12"
        value="4"
        step="1">
</div>

    
    <!-- INTERACCIÓN -->
<script>

document.addEventListener("DOMContentLoaded", function () {

    const escena = document.querySelector("a-scene");

    const circulo = document.querySelector("#circulo");

    const marcador = document.querySelector(
        '[mindar-image-target="targetIndex: 0"]'
    );

    const deslizador = document.querySelector("#partes");

    const numeroPartes = document.querySelector("#numeroPartes");


    let cantidadPartes = 4;


    const colores = [
        "red",
        "blue",
        "green",
        "yellow",
        "orange",
        "purple",
        "cyan",
        "pink",
        "lime",
        "brown",
        "magenta",
        "teal"
    ];


    function crearSectores(cantidad) {

        circulo.innerHTML = "";

        const angulo =
            360 / cantidad;


        for (let i = 0; i < cantidad; i++) {

            const sector =
                document.createElement("a-entity");


            sector.setAttribute(
                "id",
                "sector" + i
            );


            sector.classList.add("sector");


            sector.setAttribute(
                "geometry",
                "primitive: circle; radius: 1; thetaStart: " +
                (i * angulo) +
                "; thetaLength: " +
                angulo
            );


            sector.setAttribute(
                "material",
                "color: " +
                colores[i % colores.length] +
                "; side: double"
            );


            sector.setAttribute(
                "data-seleccionado",
                "false"
            );


            circulo.appendChild(sector);
        }
    }


    /*
    Crear inicialmente 4 sectores
    */

    crearSectores(4);


    /*
    Cuando se mueve el deslizador
    */

    deslizador.addEventListener(
        "input",
        function () {

            cantidadPartes =
                parseInt(this.value);


            numeroPartes.textContent =
                cantidadPartes;


            crearSectores(
                cantidadPartes
            );

        }
    );


    /*
    Detectar toque en la pantalla
    */

    document.addEventListener(
        "touchstart",
        function (evento) {

            const dedo =
                evento.touches[0];


            const x =
                dedo.clientX;

            const y =
                dedo.clientY;


            /*
            Obtener posición real del círculo
            */

            const posicion3D =
                new THREE.Vector3();


            marcador.object3D.getWorldPosition(
                posicion3D
            );


            const camara =
                escena.camera;


            const posicionPantalla =
                posicion3D.clone();


            posicionPantalla.project(
                camara
            );


            const centroX =
                (posicionPantalla.x + 1) *
                window.innerWidth / 2;


            const centroY =
                (-posicionPantalla.y + 1) *
                window.innerHeight / 2;


            /*
            Distancia del dedo al centro
            */

            const diferenciaX =
                x - centroX;


            const diferenciaY =
                centroY - y;


            const distancia =
                Math.sqrt(
                    diferenciaX *
                    diferenciaX +

                    diferenciaY *
                    diferenciaY
                );


            /*
            Radio aproximado
            */

            const radio =
                window.innerHeight * 0.15;


            if (distancia > radio) {
                return;
            }


            /*
            Calcular ángulo
            */

            let angulo =
                Math.atan2(
                    diferenciaY,
                    diferenciaX
                ) *
                180 /
                Math.PI;


            if (angulo < 0) {
                angulo += 360;
            }


            /*
            Determinar sector
            */

            const sectorSeleccionado =
                Math.floor(
                    angulo /
                    (360 / cantidadPartes)
                );


            const sector =
                document.querySelector(
                    "#sector" +
                    sectorSeleccionado
                );


            if (!sector) {
                return;
            }


            /*
            Cambiar color
            */

            const seleccionado =
                sector.getAttribute(
                    "data-seleccionado"
                );


            if (
                seleccionado === "true"
            ) {

                sector.setAttribute(
                    "data-seleccionado",
                    "false"
                );


                sector.setAttribute(
                    "material",
                    "color: " +
                    colores[
                        sectorSeleccionado %
                        colores.length
                    ] +
                    "; side: double"
                );


            } else {

                sector.setAttribute(
                    "data-seleccionado",
                    "true"
                );


                sector.setAttribute(
                    "material",
                    "color: white; side: double"
                );

            }

        }
    );

});

</script>
    
    
</body>
</html>
