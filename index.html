<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Prueba WebAR - MindAR</title>

    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

    <!-- MindAR para seguimiento de imágenes -->
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

</head>

<body>

    <a-scene
        mindar-image="imageTargetSrc: assets/marcador.mind;"
        vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: false">

        <!-- Cámara -->
        <a-camera
            position="0 0 0"
            look-controls="enabled: false">
        </a-camera>

        <!-- Objeto que aparecerá sobre el marcador -->
        <a-entity
            mindar-image-target="targetIndex: 0">

            <a-plane
                color="#F2C94C"
                position="0 0 0"
                height="0.552"
                width="1"
                rotation="0 0 0">
            </a-plane>

        </a-entity>

    </a-scene>

</body>

</html>
